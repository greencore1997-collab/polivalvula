  // Distancia Haversine en metros
  function hav(la1,lo1,la2,lo2){
    var R=6371000,dr=Math.PI/180;
    var dLat=(la2-la1)*dr, dLon=(lo2-lo1)*dr;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+
          Math.cos(la1*dr)*Math.cos(la2*dr)*
          Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }
  // Punto más cercano sobre un segmento AB al punto P
  function nearestOnSeg(px,py,ax,ay,bx,by){
    var dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;
    if(len2===0)return{x:ax,y:ay};
    var t=((px-ax)*dx+(py-ay)*dy)/len2;
    t=Math.max(0,Math.min(1,t));
    return{x:ax+t*dx,y:ay+t*dy};
  }
  // Punto más cercano sobre una polilínea (array de {lat,lon})
  function nearestOnWay(lat,lon,geom){
    var best=null,bestD=Infinity;
    for(var i=0;i<geom.length-1;i++){
      var n=nearestOnSeg(lon,lat,geom[i].lon,geom[i].lat,geom[i+1].lon,geom[i+1].lat);
      var d=hav(lat,lon,n.y,n.x);
      if(d<bestD){bestD=d;best={lat:n.y,lon:n.x};}
    }
    return{pt:best,dist:bestD};
  }
  // Extraer el número de una vía colombiana ("Carrera 12 A" → "12 A", "Calle 18" → "18")
  function extractNum(name){
    var m=name.match(/(\d+\s*[A-Za-z]?)/);
    return m?m[1].trim():name;
  }
  // Construir dirección colombiana a partir de coordenadas
  function buildAddr(lat,lon,elId){
    // Paso 1 – Nominatim para vía principal
    fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+
          '&format=json&zoom=18&addressdetails=1',
      {headers:{'Accept-Language':'es'}})
    .then(function(r){return r.json();})
    .then(function(d){
      var a=d.address||{};
      var primary=a.road||a.pedestrian||a.path||a.footway||'';
      // Paso 2 – Overpass para geometría de vías cercanas (radio 180 m)
      var q='[out:json][timeout:15];way(around:180,'+lat+','+lon+')[highway][name];out geom;';
      return fetch('https://overpass-api.de/api/interpreter',{
        method:'POST',body:'data='+encodeURIComponent(q)
      }).then(function(r){return r.json();})
        .then(function(ov){return{primary:primary,ov:ov};});
    })
    .then(function(res){
      var primary=res.primary, ways=res.ov.elements||[];
      if(!ways.length){setAddr(elId,primary||'—');return;}

      // Vía más cercana al punto = vía principal (confirma / reemplaza Nominatim)
      var primaryWay=null,minD=Infinity;
      ways.forEach(function(w){
        if(!w.geometry||w.geometry.length<2)return;
        var r=nearestOnWay(lat,lon,w.geometry);
        if(r.dist<minD){minD=r.dist;primaryWay=w;}
      });
      if(!primaryWay){setAddr(elId,primary||'—');return;}
      var primaryName=primaryWay.tags&&primaryWay.tags.name?primaryWay.tags.name:primary;

      // Vía más cercana DIFERENTE (cruce)
      var crossWay=null,crossNearest=null,minCD=Infinity;
      ways.forEach(function(w){
        if(!w.geometry||w.geometry.length<2)return;
        if(w.id===primaryWay.id)return;
        var wName=(w.tags&&w.tags.name)||'';
        if(wName===primaryName)return; // misma vía con otro tramo
        var r=nearestOnWay(lat,lon,w.geometry);
        if(r.dist<minCD){minCD=r.dist;crossWay=w;crossNearest=r.pt;}
      });

      if(!crossWay||!crossNearest){setAddr(elId,primaryName);return;}
      var crossName=(crossWay.tags&&crossWay.tags.name)||'';
      var crossNum=extractNum(crossName);
      // Metros desde el punto hasta el cruce
      var metros=Math.round(hav(lat,lon,crossNearest.lat,crossNearest.lon));
      var addr=primaryName+' # '+crossNum+' - '+metros;
      setAddr(elId,addr);
    })
    .catch(function(){setAddr(elId,'No disponible');});
  }
  function setAddr(elId,txt){
    var el=document.getElementById(elId);
    if(el){el.textContent=txt;el.style.fontStyle='normal';el.style.color='#111';el.style.fontWeight='500';}
  }
